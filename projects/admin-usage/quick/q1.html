<!DOCTYPE html>
<!--
QUICK PROTOTYPE: Organization > Usage tab (role usage, unused roles, bulk archive)

WHAT IT SHOWS
  A new "Usage" tab, placed after the last existing tab (Data & Privacy) on the Organization page.
  It shows (1) a 90-day usage line per role, (2) a list of roles nobody used in 90 days with a bulk
  "Archive Roles" action, (3) a right-hand drawer, opened by picking any role, that lists who holds it.

WHERE IT SITS
  Admin > Organization (route orgPaths('') -> /organization/:id), ?tab=usage. Host page:
  src/components/org/upsertOrgPage.tsx (tabs are FSTabs/FSTab, enum UpsertOrgPageTabs in org/utils.ts,
  labels in ORG_TAB_LABEL_MAP). The new tab would add UpsertOrgPageTabs.Usage = 'usage'.

MODELLED ON
  Frame: upsertOrgPage.tsx (inline org header, FSTabs bar, maxWidth 1200) + orgPageV2 tab anatomy
  (padding 1.5rem, TabTitle, sections, FSDivider). Lists: roles list toolbar (rolesListSlotComponents.tsx),
  users list bulk-selection toolbar (orgUsersListSlotComponents.tsx) and FSDataGrid defaults from the
  installed FUI 5.5.4 theme. Drawer: FSDrawer + FSDrawerHeader/Content/Actions. Compact list:
  role/networkConfig/devicesDrawer.tsx. Dialog: role/deleteConfirmationDialog.tsx. Empty state: the
  hand-rolled RolesListInitialEmptyState pattern. No existing tab's layout or content is reused.

NAVIGATION PERSON
  An org admin of a single (non-global) law-enforcement organization, "Ridgeline Police Department",
  roughly 200 people. Sub-nav they see: Profile, Organization (active), Devices, Roles, Users, Zones,
  Integrations. No "Organizations List" and no "< Organization List" back link (global admins only).
  Assumed to hold every Organization tab permission, so all six existing tabs show.

STATES  (?state=<name>, default first)
  default           roles with usage, 12 unused roles, nothing selected
  empty             the organization has no roles yet (whole-tab empty state). The unused list also has its
                    own section-level empty state: archive all 12 unused roles in the default state to see it
  loading           content-shaped skeletons for both sections
  archive-assigned  default page with the archive dialog open for a role that 40 people still hold

GAPS (data-gap attributes mark each one in the markup)
  1. 90-day usage line chart: no chart component in FUI 5.5.4 and none in Coke (dashboard-patterns.md says so).
     Drawn here as inline SVG. Needs a design-system decision.
  2. Role usage data and the definition of "used": no endpoint, no field. Assumed: a holder exercised one of
     the role's permissions that day. The "Last Used", "Active Holders" and chart values are all mock.
  3. "Archive" for roles: the product only has Delete, and it is disabled while a role has users
     (rolesList.tsx: canDeleteRoles = userCount === 0). Archive, "restore it later" and where archived roles
     are listed do not exist today.
  4. What happens to people who still hold an archived role. Prototype proposes: they keep the role's access
     until reassigned, and an acknowledgement checkbox gates the confirm button. This is a product decision.
  5. Holders drawer: the existing "N Users" link navigates away to /users?role=<id>. A side panel listing
     holders with per-person "last used" is new (FSDrawer and FSList are real; the content is new).
  6. Per-role "Active Holders" and "last used" per person need the same usage data as gap 2.
  Also: design-system finding, warningContainer.contrastText on warningContainer.main is about 3.5:1.

ICONS: the product uses FSSymbol (Material Symbols font). A single file may not load fonts, so these are
inline SVG paths of the same glyphs. Typography sizes are MUI defaults; FUI's variant weights were not read.
-->

const DISTINCT_FRAC = { high: .92, mid: .72, low: .4, declining: .6, spiky: .45, none: 0 };

function makeRole(r, idx) {
    const [id, name, category, holders, profile, lastUsedDays] = r;
    const rand = rng(1000 + idx * 37);
    const lastIdx = lastUsedDays === null ? -1 : Math.min(N - 1, N - lastUsedDays);   // last day index with activity
    const daily = [];
    for (let i = 0; i < N; i++) {
        const dow = dayDate(i).getDay();
        const wk = (dow === 0 || dow === 6) ? .45 : 1;
        let p = { high: .78, mid: .5, low: .2, none: 0 }[profile];
        if (profile === 'declining') p = .7 - .6 * (i / N);
        if (profile === 'spiky') p = (i % 23 < 3) ? .7 : .06;
        let v = p * wk * (.8 + .4 * rand());
        if (i > lastIdx) v = 0;
        daily.push(holders ? Math.round(v * holders) / holders : 0);
    }
    const series = daily.map((_, i) => { let s = 0, c = 0; for (let k = Math.max(0, i - 6); k <= i; k++) { s += daily[k]; c++; } return s / c; });
    const active = lastUsedDays !== null && lastUsedDays <= N && holders ? Math.max(1, Math.round(holders * DISTINCT_FRAC[profile])) : 0;
    return { id, name, category, holders, profile, lastUsedDays, series, active, activePct: holders ? active / holders : 0 };
}

function holdersOf(role) {
    if (role._holders) return role._holders;
    const rand = rng(role.id.length * 131 + role.holders);
    const used = new Set(); const out = [];
    for (let i = 0; i < role.holders; i++) {
        let nm; do { nm = [FIRST[Math.floor(rand() * FIRST.length)], LAST[Math.floor(rand() * LAST.length)]]; } while (used.has(nm.join(' ')));

        if (i < role.active) usedDays = i === 0 ? role.lastUsedDays : Math.min(N - 1, role.lastUsedDays + Math.floor(rand() * (N - role.lastUsedDays)));
        out.push({ name: nm.join(' '), email: (nm[0] + '.' + nm[1]).toLowerCase() + '@ridgelinepd.gov', usedDays });
    }

}

// opts: {w,h,pad,key}; returns svg markup. Y is 0-100% of holders (shared scale across all roles).
function chartSvg(role, o) {
    const { w, h, pad } = o; const n = role.series.length;
    const x = (i) => pad + (w - 2 * pad) * i / (n - 1);
    const y = (v) => h - pad - (h - 2 * pad) * Math.min(1, v);
    const pts = role.series.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
    let extra = '';
    if (o.big) {
        [0, .5, 1].forEach((g) => { extra += '<line class="gridline" x1="' + pad + '" x2="' + (w - pad) + '" y1="' + y(g) + '" y2="' + y(g) + '"/><text x="0" y="' + (y(g) + 3) + '">' + (g * 100) + '%</text>'; });
        [0, 30, 60, 89].forEach((i) => { extra += '<text x="' + x(i) + '" y="' + (h + 14) + '" text-anchor="' + (i === 0 ? 'start' : i === 89 ? 'end' : 'middle') + '">' + fmtShort(dayDate(i)) + '</text>'; });
    }
    return '<svg class="' + (o.big ? 'big' : 'spark') + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" data-chart="' + role.id + '" data-w="' + w + '" data-pad="' + pad + '"' +
        (o.big ? ' tabindex="0"' : '') + ' role="img" aria-label="' + esc(chartSummary(role)) + '">' +
        (o.big ? '' : '<line class="base" x1="0" x2="' + w + '" y1="' + (h - pad) + '" y2="' + (h - pad) + '"/>') + extra +
        '<polyline class="line" points="' + pts + '" vector-effect="non-scaling-stroke"/>' +
        '<line class="cross" y1="' + pad + '" y2="' + (h - pad) + '"/><circle class="hov" r="4"/>' +
        '<circle class="end" r="3" cx="' + x(n - 1).toFixed(1) + '" cy="' + y(role.series[n - 1]).toFixed(1) + '"/></svg>';
}
function chartSummary(role) {
    if (!role.holders) return role.name + ': no one holds this role.';
    const pk = Math.max.apply(null, role.series);
    if (isUnused(role)) return role.name + ': no activity in the last 90 days.';
    return role.name + ', share of holders active per day over 90 days: ' + Math.round(role.series[0] * 100) + '% at the start, ' + Math.round(role.series[N - 1] * 100) + '% at the end, peak ' + Math.round(pk * 100) + '%.';
}
const tip = document.getElementById('tip');
function scrub(svg, clientX, clientY, idx) {
    const role = roles.find((r) => r.id === svg.dataset.chart) || archived.find((r) => r.id === svg.dataset.chart); if (!role) return;
    const w = +svg.dataset.w, pad = +svg.dataset.pad, rect = svg.getBoundingClientRect();
    if (idx == null) idx = Math.round(Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)) * (N - 1));
    const cx = pad + (w - 2 * pad) * idx / (N - 1);
    const vb = svg.viewBox.baseVal, h = vb.height;
    const cy = h - pad - (h - 2 * pad) * Math.min(1, role.series[idx]);
    const cross = svg.querySelector('.cross'), dot = svg.querySelector('.hov');
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.style.visibility = 'visible';
    dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.style.visibility = 'visible';
    const pct = Math.round(role.series[idx] * 100);
    tip.innerHTML = '<strong>' + fmtDate(dayDate(idx)) + '</strong><br>' + pct + '% of ' + plural(role.holders, 'holder') + ' active<br><span style="opacity:.8">7-day average</span>';
    tip.style.display = 'block';
    const r2 = svg.getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - 250, r2.left + r2.width * idx / (N - 1) + 12) + 'px';
    tip.style.top = Math.max(8, r2.top - 62) + 'px';
}

}
function sectionHead(title, desc) {
    return '<h3 class="section-heading" tabindex="-1" data-component="FSTypography">' + title + '</h3><p class="section-desc secondary" data-component="FSTypography">' + desc + '</p>';
}

/* ----- Whole tab ----- */
function renderTab() {
    if (STATE === 'loading') {
        const bar = (h, w) => '<div class="skel" style="height:' + h + 'px;' + (w ? 'width:' + w + ';' : '') + '"></div>';
        const rows = (n, h) => Array.from({ length: n }, () => '<div style="margin-top:8px">' + bar(h) + '</div>').join('');
        content.innerHTML = '<div aria-busy="true" data-e2e-ref="loading-skeleton" data-component="FSSkeleton"><span class="visually-hidden" role="status">Loading role usage</span>' +
            bar(24, '180px') + '<div style="margin-top:8px">' + bar(18, '60%') + '</div><div style="margin-top:16px">' + bar(44, '565px') + '</div><div style="margin-top:16px">' + bar(28, '120px') + '</div>' + rows(6, 56) +
            '<hr class="divider">' + bar(24, '160px') + '<div style="margin-top:8px">' + bar(18, '50%') + '</div><div style="margin-top:16px">' + bar(28, '140px') + '</div>' + rows(4, 48) + '</div>';
        return;
    }
    if (STATE === 'empty') {
        content.innerHTML = '<div class="empty" data-component="RolesListInitialEmptyState" data-e2e-ref="empty-state">' + icon('lock').replace('class="icon"', 'class="icon" style="width:36px;height:36px;color:var(--outline)"') +
            '<div class="t">No Roles Found</div><div class="d">Role usage appears here once ' + esc(ORG) + ' has roles and people assigned to them.</div>' +
            '<button class="btn primary" data-component="FSButton" data-e2e-ref="add-role-button">Add New Role</button></div>';
        return;
    }
    const unusedN = roles.filter(isUnused).length;
    content.innerHTML =
        '<section class="section" aria-labelledby="usageHeading">' + sectionHead('Usage by Role', 'Each line shows the share of a role’s holders who were active per day, as a 7-day average. The scale is 0–100% on every row, so rows compare directly.').replace('<h3 ', '<h3 id="usageHeading" ') +
        '<div class="toolbar" data-component="FSGridToolbarContainer"><div class="quick-filter" data-component="FSGridToolbarQuickFilter">' + icon('search') + '<input type="search" id="inUseSearch" placeholder="Search" aria-label="Search roles" data-key="inuse-search"></div>' +
        '<div class="toolbar-row2"><div class="count" id="inUseCount" aria-live="polite"></div><div class="spacer"></div>' + (unusedN ? '<button class="link" style="font-size:.875rem" data-jump data-key="jump">Jump to Unused Roles (' + unusedN + ')</button>' : '') + '</div></div>' +
        '<div id="inUseBody"></div></section><hr class="divider"><section class="section" id="unusedSection" aria-label="Unused roles" data-e2e-ref="unused-section"></section>';
    renderInUseBody(); renderUnused();
}

/* ================= Layers ================= */
let lastTrigger = null;
const drawer = $('#drawer'), scrim = $('#drawerScrim'), dlgScrim = $('#dialogScrim'), dlg = $('#dialog'), menu = $('#menu'), snack = $('#snackbar');
const findRole = (id) => roles.find((r) => r.id === id);

function weeklyRows(role) {
    const out = [];
    for (let s = 0; s < N; s += 7) { const e = Math.min(N, s + 7); let sum = 0; for (let i = s; i < e; i++) sum += role.series[i]; out.push([fmtShort(dayDate(s)) + ' – ' + fmtShort(dayDate(e - 1)), Math.round(sum / (e - s) * 100)]); }
    return out;
}
function holderListHtml(role, q) {
    const list = holdersOf(role).filter((h) => !q || h.name.toLowerCase().includes(q.toLowerCase()) || h.email.includes(q.toLowerCase()));
    if (!role.holders) return '<p class="secondary" style="font-size:.875rem;margin-top:12px">No one holds this role. It can be archived without affecting anyone.</p>';
    if (!list.length) return '<p class="secondary" style="font-size:.875rem;margin-top:12px">No users found matching the search.</p>';
    return '<ul class="fs-list" data-component="FSList">' + list.map((h) => '<li data-component="FSListItem"><div><div class="nm">' + esc(h.name) + '</div><div class="cap">' + esc(h.email) + '</div></div><div class="right">' +
        (h.usedDays === null ? 'Not used in 90 days' : 'Used ' + fmtDate(daysAgoDate(h.usedDays))) + '</div></li>').join('') + '</ul>';
}
function openDrawer(id, trigger) {
    const role = findRole(id); if (!role) return;
    lastTrigger = trigger || lastTrigger;
    const unused = isUnused(role);
    drawer.dataset.role = id;
    drawer.innerHTML =
        '<div class="drawer-header" data-component="FSDrawerHeader"><div style="flex:1"><h2 id="drawerTitle">' + esc(role.name) + '</h2><div class="cell-sub" style="font-size:.875rem">Category: ' + esc(role.category) + '</div></div>' +
        '<button class="icon-btn" data-close-drawer aria-label="Close ' + esc(role.name) + ' details">' + icon('close') + '</button></div>' +
        '<div class="drawer-content" data-component="FSDrawerContent">' +
        '<div class="stats"><div class="stat"><div class="label">Active Holders</div><div class="value">' + role.active + ' of ' + role.holders + '</div><div class="cell-sub">in the last 90 days</div></div>' +
        '<div class="stat"><div class="label">Last Used</div><div class="value">' + (role.lastUsedDays === null ? 'Never' : relative(role.lastUsedDays)) + '</div><div class="cell-sub">' + (role.lastUsedDays === null ? 'No activity recorded' : fmtDate(daysAgoDate(role.lastUsedDays))) + '</div></div></div>' +
        '<div class="drawer-section"><h3 data-component="FSTypography">Usage, Last 90 Days</h3><p class="secondary" style="font-size:.875rem">' + (unused ? 'No holder used this role in the last 90 days.' : 'Share of holders active per day, 7-day average. Use the arrow keys to read values.') + '</p>' +
        '<div style="margin-top:12px;padding-bottom:16px" data-component="none" data-gap="90-day usage line chart (no chart component in FUI 5.5.4 or Coke)" data-e2e-ref="drawer-usage-chart">' + chartSvg(role, { w: 432, h: 130, pad: 8, big: true }) + '</div>' +
        '<details class="accordion" data-component="FSAccordion"><summary>View Chart Data</summary><table><thead><tr><th scope="col">Week</th><th scope="col">Holders active (avg.)</th></tr></thead><tbody>' + weeklyRows(role).map((w) => '<tr><td>' + w[0] + '</td><td>' + w[1] + '%</td></tr>').join('') + '</tbody></table></details></div>' +
        '<div class="drawer-section"><h3 data-component="FSTypography">Users With This Role</h3><div class="count" style="font-size:16px" aria-live="polite" id="holderCount">' + plural(role.holders, 'User') + '</div>' +
        (role.holders ? '<input type="search" class="text-field" id="holderSearch" placeholder="Search users" aria-label="Search users with this role" data-component="FSTextField">' : '') +
        '<div id="holderList">' + holderListHtml(role, '') + '</div></div></div>' +
        '<div class="drawer-actions" data-component="FSDrawerActions"><button class="btn destructiveSecondary" data-archive-one="' + id + '" data-component="FSButton">Archive Role</button><div class="spacer"></div>' +
        '<a class="btn secondary" href="#" data-component="FSButton" data-open-users="' + id + '">Open in Users</a></div>';
    scrim.style.display = 'block'; drawer.style.display = 'flex';
    $('[data-close-drawer]', drawer).focus();
    const s = $('#holderSearch', drawer);
    if (s) s.addEventListener('input', () => { $('#holderList', drawer).innerHTML = holderListHtml(role, s.value); });
}
function closeDrawer(restore) {
    drawer.style.display = 'none'; scrim.style.display = 'none'; tip.style.display = 'none';
    if (restore !== false && lastTrigger && document.contains(lastTrigger)) lastTrigger.focus();
}

/* ----- Menu ----- */
function openMenu(id, btn) {
    const role = findRole(id);
    menu.innerHTML = '<button role="menuitem" data-open="' + id + '">View Users</button><button role="menuitem" class="danger" data-archive-one="' + id + '">Archive</button>';
    const r = btn.getBoundingClientRect(); menu.style.display = 'block';
    menu.style.top = (r.bottom + 4) + 'px'; menu.style.left = Math.max(8, r.right - menu.offsetWidth) + 'px';
    menu._btn = btn; menu.querySelector('button').focus();
}
function closeMenu(restore) { if (menu.style.display === 'none') return; menu.style.display = 'none'; if (restore && menu._btn) menu._btn.focus(); }

/* ----- Archive dialog (gaps 3 and 4) ----- */
let pendingIds = [];
function openArchive(ids, trigger) {
    pendingIds = ids; if (trigger) lastTrigger = trigger;
    const rs = ids.map(findRole).filter(Boolean); if (!rs.length) return;
    const holders = rs.reduce((s, r) => s + r.holders, 0), active = rs.reduce((s, r) => s + r.active, 0);
    const one = rs.length === 1;
    const title = one ? 'Archive Role' : 'Archive ' + rs.length + ' Roles';
    let h = '<div class="dialog-title"><h2 id="dialogTitle" data-component="FSDialogTitle">' + title + '</h2><button class="icon-btn" data-close-dialog aria-label="Close">' + icon('close') + '</button></div><div class="dialog-content" data-component="FSDialogContent">';
    h += '<p data-component="FSDialogContentText">' + (one ? 'Archive <strong>' + esc(rs[0].name) + '</strong>? It will be removed from the Roles list and from Assign to Role. You can restore it later.' :
        'Archive these ' + rs.length + ' roles? They will be removed from the Roles list and from Assign to Role. You can restore them later.') + '</p>';
    if (!one) h += '<ul class="fs-list" data-component="FSList">' + rs.map((r) => '<li><div class="nm">' + esc(r.name) + '</div><div class="right">' + (r.holders ? '<button class="link" data-review="' + r.id + '">Review ' + plural(r.holders, 'User') + '</button>' : '0 Users') + '</div></li>').join('') + '</ul>';
    if (holders) {
        h += '<div class="alert" role="alert" data-component="FSAlert" data-e2e-ref="assigned-warning" data-gap="warning for archiving roles that still have users (new decision, gap 4)">' + icon('warn') +
            '<span>' + plural(holders, 'user') + (holders === 1 ? ' still holds ' : ' still hold ') + (one ? 'this role' : 'these roles') + '. They keep ' + (one ? 'its' : 'their') + ' access until you assign them a different role. ' +
            (active ? active + ' of them used ' + (one ? 'it' : 'them') + ' in the last 90 days.' : 'None of them used ' + (one ? 'it' : 'them') + ' in the last 90 days.') + '</span>' +
            (one ? '<button class="link" data-review="' + rs[0].id + '" data-component="FSAlertButton">Review Users</button>' : '') + '</div>' +
            '<label class="check-row" data-component="FSCheckbox" data-gap="acknowledgement gate before archiving roles that still have users"><input type="checkbox" id="ackBox"> I’ve reviewed the ' + plural(holders, 'user') + ' who ' + (holders === 1 ? 'holds ' : 'hold ') + (one ? 'this role' : 'these roles') + '</label>';
    }
    h += '</div><div class="dialog-actions" data-component="FSDialogActions"><button class="btn ghost" data-close-dialog data-component="FSButton" id="dlgCancel">Cancel</button><div class="spacer"></div>' +
        '<span id="confirmWrap" title="' + (holders ? 'Confirm you’ve reviewed the users first' : '') + '"><button class="btn destructivePrimary" id="confirmArchive" data-component="FSLoadingButton" data-e2e-ref="archive-confirm-button"' + (holders ? ' disabled aria-describedby="confirmHint"' : '') + '>' + (one ? 'Archive Role' : 'Archive ' + rs.length + ' Roles') + '</button></span>' +
        (holders ? '<span id="confirmHint" class="visually-hidden">Check the box to confirm you’ve reviewed the users first.</span>' : '') + '</div>';
    dlg.innerHTML = h; dlgScrim.style.display = 'flex'; $('#dlgCancel').focus();
    const ack = $('#ackBox'); if (ack) ack.addEventListener('change', () => { $('#confirmArchive').disabled = !ack.checked; $('#confirmWrap').title = ack.checked ? '' : 'Confirm you’ve reviewed the users first'; });
}
function closeDialog(restore) { dlgScrim.style.display = 'none'; if (restore !== false && lastTrigger && document.contains(lastTrigger)) lastTrigger.focus(); }
function confirmArchive() {
    const btn = $('#confirmArchive'); btn.disabled = true; btn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Archiving'; btn.setAttribute('aria-busy', 'true');
    setTimeout(() => {
        const rs = pendingIds.map(findRole).filter(Boolean), holders = rs.reduce((s, r) => s + r.holders, 0);
        roles = roles.filter((r) => !pendingIds.includes(r.id)); archived.push.apply(archived, rs);
        pendingIds.forEach((id) => G.unused.selected.delete(id));
        closeDialog(false); closeDrawer(false);
        renderInUseBody(); renderUnused();
        const msg = rs.length === 1 ? 'Archived ' + rs[0].name + '.' : 'Archived ' + rs.length + ' roles.';
        toast(msg + (holders ? ' ' + plural(holders, 'user') + (holders === 1 ? ' still holds it.' : ' still hold ' + (rs.length === 1 ? 'it.' : 'them.')) : ''));
        const h = $('#unusedSection h3'); if (h) h.focus(); else $('#usageHeading') && $('#usageHeading').focus();
    }, 900);
}
let toastTimer;
function toast(msg) { snack.innerHTML = icon('ok') + '<span>' + esc(msg) + '</span>'; snack.style.display = 'flex'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { snack.style.display = 'none'; }, 6000); }

/* ================= Events ================= */
document.addEventListener('click', (e) => {
    const t = e.target;
    const c = (sel) => t.closest(sel);
    if (menu.style.display === 'block' && !c('#menu') && !c('[data-menu]')) closeMenu(false);
    let el;
    if ((el = c('[data-menu]'))) { e.stopPropagation(); return openMenu(el.dataset.menu, el); }
    if ((el = c('#menu [data-open]'))) { const id = el.dataset.open; const b = menu._btn; closeMenu(false); return openDrawer(id, b); }
    if ((el = c('#menu [data-archive-one]'))) { const id = el.dataset.archiveOne; const b = menu._btn; closeMenu(false); return openArchive([id], b); }
    if ((el = c('[data-sort]'))) { const g = el.closest('#unusedBody') ? G.unused : G.inUse; const k = el.dataset.sort; if (g.sortKey === k) g.dir = g.dir === 'asc' ? 'desc' : 'asc'; else { g.sortKey = k; g.dir = 'asc'; } return g === G.unused ? renderUnused() : renderInUseBody(); }
    if ((el = c('[data-page]'))) { G.inUse.page += +el.dataset.page; return renderInUseBody(); }
    if ((el = c('[data-jump]'))) { const h = $('#unusedSection h3') || $('#unusedSection'); h.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return h.focus && h.focus(); }
    if ((el = c('[data-bulk-archive]'))) { return openArchive(Array.from(G.unused.selected), el); }
    if ((el = c('[data-close-drawer]'))) return closeDrawer();
    if (c('#drawerScrim')) return closeDrawer();
    if ((el = c('[data-archive-one]'))) { return openArchive([el.dataset.archiveOne], el); }
    if ((el = c('[data-review]'))) { const id = el.dataset.review; closeDialog(false); return openDrawer(id, lastTrigger); }
    if ((el = c('[data-close-dialog]'))) return closeDialog();
    if (t === dlgScrim) return closeDialog();
    if (t.id === 'confirmArchive' || c('#confirmArchive')) return confirmArchive();
    if ((el = c('[data-open-users]'))) { e.preventDefault(); return; }
    if ((el = c('[data-open]'))) return openDrawer(el.dataset.open, el);
    if (c('input[type="checkbox"]')) return;                                  // handled in change
    const row = c('tr[data-row]'); if (row && !c('button, a, input, label')) return openDrawer(row.dataset.row, row.querySelector('[data-open]'));
});
document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('[data-select-all]')) { const rows = roles.filter(isUnused); G.unused.selected = t.checked ? new Set(rows.map((r) => r.id)) : new Set(); renderUnused(); }
    else if (t.matches('[data-select]')) { t.checked ? G.unused.selected.add(t.dataset.select) : G.unused.selected.delete(t.dataset.select); renderUnused(); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'inUseSearch') { G.inUse.query = e.target.value; G.inUse.page = 0; renderInUseBody(); } });
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        if (dlgScrim.style.display === 'flex') return closeDialog();
        if (menu.style.display === 'block') return closeMenu(true);
        if (drawer.style.display === 'flex') return closeDrawer();
    }
    if (e.key === 'Tab') {                                                       // keep focus inside the top layer
        const layer = dlgScrim.style.display === 'flex' ? dlg : drawer.style.display === 'flex' ? drawer : null; if (!layer) return;
        const f = Array.from(layer.querySelectorAll('button:not(:disabled), a[href], input:not(:disabled), summary, [tabindex="0"]'));
        if (!f.length) return; const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    if (menu.style.display === 'block' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
        e.preventDefault(); const items = Array.from(menu.querySelectorAll('button')); const i = items.indexOf(document.activeElement);
        items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
    }
});
window.addEventListener('scroll', () => closeMenu(false), true);

/* ================= Boot ================= */
renderTab();
if (STATE === 'archive-assigned') openArchive(['legacy-hotlist'], null);
})();
</script>
</body>
</html>
