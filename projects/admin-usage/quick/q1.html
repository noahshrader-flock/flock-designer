<!doctype html>
<!--
  QUICK PROTOTYPE: Organization → "Usage" tab (role usage and bulk archive)

  WHAT IT SHOWS
    A new last tab on the Organization page. An org admin sees how each role was used over the last 90 days,
    gets a list of roles nobody used (with a bulk Archive action), and can open any role to see who holds it.

  WHERE IT SITS
    Coke → Admin → Organization (`/organization/:id?tab=usage`, also `/?tab=usage` for the current org).
    Tab bar order: Overview · Package & Features · Policies · Settings · Authentication · Data & Privacy · Usage (new, last).
    The other tabs are drawn but inert; only Usage is built.

  MODELLED ON (real screens in flock-coke)
    - Page frame, header and tab bar: src/components/org/upsertOrgPage.tsx (FSGrid padding 1rem 1.5rem, 1200px column,
      org-type label + h1, FSTabs in a divider-bordered box).
    - Tab body: orgPageV2 convention (padding 1.5rem, TabTitle, h6 section headings, FSDivider between peer sections).
    - Lists and toolbar: role/rolesList/* (count header "{n} Roles", quick filter, empty states) and user/orgUsersList.tsx
      (the only FSDataGrid with checkboxSelection).
    - Confirm dialog: role/deleteConfirmationDialog.tsx (FSDialog with manual close-X, ghost Cancel, destructivePrimary).
    - Side panel: FSDrawerHeader/Content/Actions (right, 640px) with the FSList + FSDivider list from devicesDrawer.tsx.
    - Global nav: FSUniversalNav (standalone, non-flockForward) as built by appHeader.tsx → StandaloneAppHeader.

  WHO THE NAVIGATION SHOWS
    An org admin of a law-enforcement customer org ("Lakeview Police Department", fictional, 214 users, 48 roles) who is
    NOT a Flock internal admin: no "Organizations List" sub-nav item and no "< Organization List" back link.
    Sub-nav items that person sees: Profile, Organization (active), Devices, Roles, Users, Zones, Data Preservation,
    Integrations, Alerts & FlockOS. All six existing tabs are shown (LE org, manage-org permission, flags on).
    The top-bar app links, help and account menus come from the signed-in account (not in code): they follow
    src/mocks/fixtures/account.json and MAY NOT match what people see today.

  STATES  (?state=…, default first)
    default          loaded: summary, unused roles, roles in use
    loading          content-shaped skeletons, tab bar stays
    empty            org has no role usage yet (no roles with usage data): one empty state, no toolbar
    nothing-unused   every role was used in 90 days: the Unused Roles section's own empty state
    archive-assigned archiving "Legacy Search Access", still assigned to 40 users (dialog open on load)
  Interactions that work: pick a role → side panel; check unused roles → Archive Roles → confirm → snackbar with Undo;
  sort / search / page the Roles in Use table; panel user search and Show More.

  GAPS: things this page shows that the product cannot do or does not have today
    1. Role usage metric: no endpoint or DTO says "a role was used on day X by N people". "Used" is assumed to mean a
       holder performed an action the role grants. Needs a definition and a Crown/Tanqueray source.   [data-gap on chart, columns]
    2. Archive: Coke only has Delete, which is disabled while a role has users (rolesList.tsx). Archive, an Archived state,
       restore, and what happens to current holders (loses the role? keeps it?) are all new decisions.   [data-gap]
    3. Charts: Coke has no chart or dashboard pattern (dashboard-patterns.md) and no chart library in package.json.
       The sparkline and the 90-day line chart are hand-drawn SVG.   [data-gap]
    4. Per-user "Also holds" and "no other role" warning: needs user→roles data per holder (not on RoleLite).   [data-gap]
    5. Undo in the snackbar: FSSnackbar supports an action; restoring a role needs a backend restore.
    6. Summary tiles: no dashboard tiles in Coke. Built from the plan-card pattern (FSCard outlined, FSGrid), numbers at 20px.
    7. "View as table" under the chart (chart text alternative) has no counterpart.   [data-gap]
    8. State switcher bottom-left is prototype-only.   [data-gap]
    9. Usage tab visibility: which permission or flag gates it is undecided (assumed same as Settings).
   10. Icons are Material-style outlines; the non-negotiables want FSSymbol for new icons.
   11. Global nav drawn non-flockForward (green top bar). With the FLOCK_FORWARD flag the top bar is dark with a "Flock Core" chip.
   12. Top-bar app link is labelled "Cameras" because the fixture says so; Coke's own copy now says Devices.

  TOKENS
    Colours below are the design system's tokens from flock-react-component-lib (light palette; spot-checked against the
    installed 5.5.4 build; the sibling checkout is 5.6.5). Each value carries its token name in a comment.
    No raw colours are used in markup, only these variables.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage - Lakeview Police Department</title>
<style>
  :root {
    /* ---- colour tokens (createFSTheme('light').palette) ---- */
    --primary-main: #108062;               /* palette.primary.main (pineGreen[50]) */
    --primary-dark: #1D6D59;               /* palette.primary.dark (pineGreen[40]) */
    --primary-contrastText: #FFFFFF;       /* palette.primary.contrastText */
    --primaryContainer-main: #E0F2EC;      /* palette.primaryContainer.main (pineGreen[95]) */
    --secondary-main: #032E32;             /* palette.secondary.main (raven[40]) */
    --surface0-main: #F9FDFF;              /* palette.surface0.main (sky[99]) */
    --surface1-main: #F2F7FA;              /* palette.surface1.main (sky[98]) */
    --surface4-main: #D3DEE2;              /* palette.surface4.main (sky[90]); also outlineDivider */
    --surface5-main: #C9D7DB;              /* palette.surface5.main (sky[87]) */
    --surfaceVariant-contrastText: #35494F;/* palette.surfaceVariant.contrastText (sky[30]) */
    --outline-main: #5F838F;               /* palette.outline.main (sky[50]) */
    --outlineVariant-main: #A9BDC4;        /* palette.outlineVariant.main (sky[70]) */
    --neutralContainer-main: #E5EBEE;      /* palette.neutralContainer.main (sky[94]) */
    --neutralContainer-contrastText: #35494F; /* palette.neutralContainer.contrastText (sky[30]) */
    --neutralBorder-main: #35494F66;       /* palette.neutralBorder.main */
    --error-main: #BA1A1A;                 /* palette.error.main (red[40]) */
    --error-dark: #93000A;                 /* palette.error.dark (red[30]) */
    --error-contrastText: #FFFFFF;         /* palette.error.contrastText */
    --errorContainer-main: #FFEDEA;        /* palette.errorContainer.main (red[95]) */
    --errorContainer-contrastText: #DE3730;/* palette.errorContainer.contrastText (red[50]) */
    --warningContainer-main: #FFEFD4;      /* palette.warningContainer.main (yellow[95]) */
    --warningContainer-contrastText: #6A4E00; /* palette.warningContainer.contrastText (yellow[35]) */
    --warningBorder-main: #6A4E0066;       /* palette.warningBorder.main */
    --successContainer-main: #E1F8E8;      /* palette.successContainer.main (grassGreen[95]) */
    --successContainer-contrastText: #17692F; /* palette.successContainer.contrastText (grassGreen[40]) */
    --successBorder-main: #17692F66;       /* palette.successBorder.main */
    --infoContainer-main: #DAF5FF;         /* palette.infoContainer.main (blue[95]) */
    --infoContainer-contrastText: #00677C; /* palette.infoContainer.contrastText (blue[40]) */
    --infoBorder-main: #00677C66;          /* palette.infoBorder.main */
    /* MUI defaults FUI does not override */
    --text-primary: rgba(0, 0, 0, 0.87);   /* palette.text.primary */
    --text-secondary: rgba(0, 0, 0, 0.6);  /* palette.text.secondary */
    --divider: rgba(0, 0, 0, 0.12);        /* palette.divider */
    --action-hover: rgba(0, 0, 0, 0.04);   /* palette.action.hover */
    --action-selected: rgba(0, 0, 0, 0.08);/* palette.action.selected */
    --action-disabled: rgba(0, 0, 0, 0.26);/* palette.action.disabled */
    --action-disabledBackground: rgba(0, 0, 0, 0.12); /* palette.action.disabledBackground */
    --background-default: #FFFFFF;         /* palette.background.default / paper */
    --backdrop: rgba(0, 0, 0, 0.5);        /* MuiBackdrop */
    /* ---- shape, spacing ---- */
    --radius: 8px;                         /* theme.shape.borderRadius */
    --sp-1: 8px;                           /* theme.spacing(1) */
    --sp-2: 16px;                          /* theme.spacing(2) */
    --sp-3: 24px;                          /* theme.spacing(3) */
    --nav-h: 48px;                         /* FSUniversalNav FSToolbar height */
    --subnav-h: 40px;                      /* FSUniversalNav secondary FSToolbar height */
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: "Inter", sans-serif;      /* typography.fontFamily */
    font-size: 1rem; line-height: 1.5;     /* body1 */
    color: var(--text-primary);
    background: var(--background-default);
  }
  button, input { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }
  :focus-visible { outline: 2px solid var(--primary-main); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---- typography variants (MUI theme, FUI sets only fontFamily) ---- */
  .t-h4 { font-size: 2.125rem; line-height: 1.235; font-weight: 400; }
  .t-h5 { font-size: 1.5rem; line-height: 1.334; font-weight: 400; }
  .t-h6 { font-size: 1.25rem; line-height: 1.6; font-weight: 500; }
  .t-subtitle1 { font-size: 1rem; line-height: 1.75; font-weight: 400; }
  .t-subtitle2 { font-size: 0.875rem; line-height: 1.57; font-weight: 500; }
  .t-body2 { font-size: 0.875rem; line-height: 1.43; font-weight: 400; }
  .t-caption { font-size: 0.75rem; line-height: 1.66; font-weight: 400; }
  .secondary { color: var(--text-secondary); }

  /* ---- icons ---- */
  svg.icon { width: 1.5rem; height: 1.5rem; fill: currentColor; flex: none; }
  svg.icon-20 { width: 20px; height: 20px; }
  svg.icon-18 { width: 18px; height: 18px; }

  /* ---- FSButton (size lg = 48px default; md = 36px; sm = 28px) ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 48px; padding: 0 16px; border-radius: var(--radius);
    font-size: 16px; font-weight: 400; line-height: 1.75; text-transform: none; white-space: nowrap;
    border: 1px solid transparent; background: none; cursor: pointer; text-decoration: none;
    min-width: 0;
  }
  .btn > .inner { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 6px; }
  .btn.md { height: 36px; padding: 0 10px; }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
  .btn.primary { background: var(--primary-main); color: var(--primary-contrastText); }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.secondary { border-color: var(--primary-main); color: var(--primary-main); }
  .btn.secondary:hover { background: var(--action-hover); }
  .btn.ghost { color: var(--secondary-main); }
  .btn.ghost:hover { background: var(--action-hover); }
  .btn.destructivePrimary { background: var(--error-main); color: var(--error-contrastText); }
  .btn.destructivePrimary:hover { background: var(--error-dark); }
  .btn.destructiveSecondary { color: var(--error-main); }
  .btn.destructiveSecondary:hover { background: var(--action-hover); }
  .btn[disabled], .btn[aria-disabled="true"] { cursor: default; pointer-events: none; }
  .btn.primary[disabled], .btn.destructivePrimary[disabled] { background: var(--action-disabledBackground); color: var(--action-disabled); }
  .btn.secondary[disabled] { border-color: var(--action-disabledBackground); color: var(--action-disabled); }
  .btn.ghost[disabled], .btn.destructiveSecondary[disabled], .btn.destructiveSecondary[aria-disabled="true"] { color: var(--action-disabled); }
  .btn.destructiveSecondary[aria-disabled="true"]:hover { background: none; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0;
    border: 0; border-radius: var(--radius); background: none; cursor: pointer; color: inherit;
  }
  .icon-btn:hover { background: var(--action-hover); }
  .icon-btn[disabled] { color: var(--action-disabled); cursor: default; }
  .link-btn { background: none; border: 0; padding: 0; color: var(--primary-main); cursor: pointer; text-decoration: underline; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- FSUniversalNav, standalone, non-flockForward ---- */
  #global-nav { position: relative; z-index: 1201; }                       /* zIndex.drawer + 1 */
  .topbar {
    display: flex; align-items: center; gap: 4px; height: var(--nav-h); padding: 0 24px;
    background: var(--primary-main); color: var(--primary-contrastText);   /* primary.main / primary.contrastText */
  }
  .topbar .icon-btn:hover, .topbar .nav-link:hover { background: var(--action-hover); }
  .topbar .brand { color: var(--primary-contrastText); margin-right: 4px; }
  .topbar .brand svg { width: 24px; height: 24px; }
  .nav-link {
    display: inline-flex; align-items: center; height: 36px; padding: 0 10px; border: 0; border-radius: var(--radius);
    background: none; font-size: 14px; line-height: 1; white-space: nowrap; text-decoration: none; cursor: pointer; color: inherit;
  }
  .nav-link.bold { font-weight: 700; }
  .topbar-apps { display: flex; align-items: center; gap: 4px; margin: 0 4px; flex-grow: 1; }
  .topbar-right { display: flex; align-items: center; gap: 4px; }
  .subnav {
    display: flex; align-items: center; height: var(--subnav-h); padding: 0 24px;
    background: var(--surface1-main); color: var(--surfaceVariant-contrastText);     /* FSToolbar secondary */
    border-bottom: 1px solid var(--surface4-main);                                    /* surface4.main */
  }
  .subnav-title { display: flex; align-items: center; }
  .subnav-title span { padding: 0 4px 0 0; font-size: 14px; font-weight: 700; line-height: 1; white-space: nowrap; }
  .subnav-title .vdiv { width: 1px; height: 30px; background: var(--divider); margin-left: 8px; }
  .subnav-items { display: flex; align-items: center; gap: 4px; margin: 0 4px 0 12px; overflow: hidden; }

  /* ---- page frame (upsertOrgPage.tsx) ---- */
  .page { padding: 16px 24px; display: flex; justify-content: center; }          /* FSGrid padding 1rem 1.5rem */
  .page-col { width: 100%; max-width: 1200px; }
  .page-head { margin-top: 16px; padding-bottom: 16px; }
  .page-head .orgtype { font-size: 14px; color: var(--text-secondary); }
  .page-head h1 { font-size: 2rem; font-weight: 500; line-height: 1.167; }          /* h1 variant, 2rem / 500 as in upsertOrgPage */
  .tabs-box { border-bottom: 1px solid var(--divider); margin-top: 8px; }
  .tabs { display: flex; padding: 0 20px; overflow-x: auto; position: relative; }   /* px 2.5 */
  .tab {
    position: relative; min-height: 48px; padding: 12px 16px; border: 0; background: none; cursor: pointer;
    font-size: 0.875rem; font-weight: 500; line-height: 1.25; text-transform: none; color: var(--text-secondary); white-space: nowrap;
  }
  .tab:hover { background: var(--action-hover); }
  .tab[aria-selected="true"] { color: var(--primary-main); }
  .tab[aria-selected="true"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--primary-main); }

  /* ---- tab body ---- */
  .tab-body { padding: 24px; }                                                     /* orgPageV2: padding 1.5rem */
  .tab-title { margin-bottom: 16px; }                                              /* TabTitle: h5/h2 + body2, mb 2 */
  .tab-title p { margin-top: 4px; }
  .section + .section-divider, .section-divider { margin: 24px 0; border: 0; border-top: 1px solid var(--divider); }
  .section-head h3 { font-size: 1.25rem; font-weight: 500; line-height: 1.6; }
  .section-head p { margin-top: 2px; margin-bottom: 16px; }

  /* ---- summary tiles (FSCard outlined in FSGrid) ---- */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { border: 1px solid var(--divider); border-radius: var(--radius); background: var(--background-default); height: 100%; }
  .card-content { padding: 16px; }
  .card .num { font-size: 20px; font-weight: 600; line-height: 1.4; margin: 4px 0 2px; }

  /* ---- toolbar (FSGridToolbarContainer) ---- */
  .toolbar-row { display: flex; align-items: flex-end; gap: 8px; }
  .toolbar-row + .toolbar-row { margin-top: 8px; }
  .toolbar-row .count { height: 25px; line-height: 25px; font-size: 1.25rem; font-weight: 500; }
  .grow { flex-grow: 1; }
  .quick-filter { position: relative; width: min(565px, 100%); }
  .quick-filter svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
  .quick-filter input {
    width: 100%; height: 44px; padding: 0 12px 0 40px; font-size: 0.875rem; background: var(--background-default);
    border: 1px solid var(--outlineVariant-main); border-radius: var(--radius);
  }
  .quick-filter input:hover { border-color: var(--text-primary); }
  .toolbar-gap { height: 16px; }

  /* ---- FSDataGrid look (table) ---- */
  .grid { border: 1px solid var(--surface5-main); border-radius: var(--radius); overflow: hidden; background: var(--background-default); }
  table.dg { width: 100%; border-collapse: collapse; }
  table.dg th {
    height: 40px; padding: 0 16px; background: var(--surface1-main); text-align: left; font-weight: 700;
    font-size: 0.75rem; white-space: nowrap; border-bottom: 1px solid var(--surface5-main);
  }
  table.dg th .sort { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font-weight: 700; font-size: 0.75rem; cursor: pointer; }
  table.dg th .sort svg { opacity: 0; transition: transform 0.15s; }
  table.dg th[aria-sort] .sort svg { opacity: 1; }
  table.dg th[aria-sort="ascending"] .sort svg { transform: rotate(180deg); }
  table.dg td { padding: 8px 16px; border-bottom: 1px solid var(--divider); vertical-align: middle; min-height: 56px; }
  table.dg tr:last-child td { border-bottom: 0; }
  table.dg tbody tr { position: relative; height: 60px; }
  table.dg tbody tr:hover { background: var(--action-hover); }
  table.dg tbody tr.selected { background: var(--primaryContainer-main); }
  table.dg .num-col { text-align: right; font-variant-numeric: tabular-nums; }
  table.dg th.num-col .sort { flex-direction: row-reverse; }
  .check-col { width: 56px; padding: 0 0 0 8px !important; position: relative; z-index: 1; }
  .check { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; }
  .check:hover { background: var(--action-hover); }
  .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--primary-main); cursor: pointer; }
  .row-link { padding: 0; border: 0; background: none; text-align: left; cursor: pointer; display: block; }
  .row-link::after { content: ''; position: absolute; inset: 0; }                 /* whole row is one real button */
  .row-link .name { font-size: 0.875rem; font-weight: 600; line-height: 1.43; }
  .row-link:hover .name { text-decoration: underline; }
  .cell-sub { display: block; font-size: 0.75rem; color: var(--text-secondary); line-height: 1.66; }
  .grid-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; height: 52px; padding: 0 8px; border-top: 1px solid var(--surface5-main); font-size: 0.75rem; }

  /* ---- FSChip variant="status" size="small" ---- */
  .chip {
    display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--radius);
    font-size: 14px; font-weight: 500; line-height: 20px; white-space: nowrap;
  }
  .chip.default { background: var(--neutralContainer-main); color: var(--neutralContainer-contrastText); }
  .chip.warning { background: var(--warningContainer-main); color: var(--warningContainer-contrastText); }
  .chip.success { background: var(--successContainer-main); color: var(--successContainer-contrastText); }
  .chip.error { background: var(--errorContainer-main); color: var(--errorContainer-contrastText); }

  /* ---- FSAlert ---- */
  .alert { display: flex; align-items: flex-start; gap: 12px; padding: 6px 16px; border-radius: var(--radius); border: 1px solid; font-size: 0.875rem; line-height: 1.43; }
  .alert .alert-icon { padding: 7px 0; display: flex; }
  .alert .alert-msg { padding: 8px 0; flex-grow: 1; }
  .alert.warning { background: var(--warningContainer-main); color: var(--warningContainer-contrastText); border-color: var(--warningBorder-main); }
  .alert.info { background: var(--infoContainer-main); color: var(--infoContainer-contrastText); border-color: var(--infoBorder-main); }
  .alert.success { background: var(--successContainer-main); color: var(--successContainer-contrastText); border-color: var(--successBorder-main); }

  /* ---- empty states (product's hand-rolled pattern) ---- */
  .empty { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 56px; margin-bottom: 32px; text-align: center; }
  .empty.compact { margin-top: 24px; margin-bottom: 24px; }
  .empty svg { width: 36px; height: 36px; color: var(--outline-main); }
  .empty .e-title { font-weight: 600; font-size: 16px; }
  .empty .e-body { font-size: 14px; max-width: 360px; }

  /* ---- skeleton (FSSkeleton) ---- */
  .skel { background: rgba(0, 0, 0, 0.11); border-radius: var(--radius); animation: pulse 2s ease-in-out 0.5s infinite; }
  .skel.text { height: 20px; border-radius: 4px; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

  /* ---- chart ---- */
  .spark-cell { width: 180px; }
  .spark { display: block; }
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-wrap:focus-visible { outline: 2px solid var(--primary-main); outline-offset: 4px; border-radius: 4px; }
  .chart-tip {
    position: absolute; pointer-events: none; min-width: 120px; padding: 8px 12px; border-radius: var(--radius);
    background: var(--background-default); border: 1px solid var(--surface5-main); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    transform: translate(-50%, -100%); margin-top: -12px; white-space: nowrap; z-index: 2;
  }
  .chart-tip[hidden] { display: none; }
  .chart-tip .tip-val { font-size: 14px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
  .chart-tip .key { width: 12px; height: 2px; background: var(--primary-main); border-radius: 1px; }
  .chart-tip .tip-date { font-size: 12px; color: var(--text-secondary); }
  details.data-table summary { cursor: pointer; font-size: 14px; color: var(--primary-main); padding: 8px 0; width: fit-content; }
  details.data-table .scroll { max-height: 220px; overflow: auto; border: 1px solid var(--surface5-main); border-radius: var(--radius); }
  details.data-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
  details.data-table th, details.data-table td { padding: 6px 16px; text-align: left; border-bottom: 1px solid var(--divider); }
  details.data-table th { background: var(--surface1-main); position: sticky; top: 0; }
  details.data-table td:last-child, details.data-table th:last-child { text-align: right; }

  /* ---- drawer (FSDrawer anchor right) ---- */
  .backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 1300; opacity: 0; transition: opacity 0.2s; }
  .backdrop.open { opacity: 1; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); z-index: 1301; display: flex; flex-direction: column;
    background: var(--background-default); box-shadow: 0 8px 10px rgba(0, 0, 0, 0.2), 0 16px 24px rgba(0, 0, 0, 0.14), 0 6px 30px rgba(0, 0, 0, 0.12);

      c.appendChild(h('div', { 'class': 'alert info', 'data-component': 'FSAlert', 'data-e2e-ref': 'unused-alert', style: 'margin-bottom:16px' },
        h('span', { 'class': 'alert-icon' }, icon(P.info, 'icon-20')),
        h('div', { 'class': 'alert-msg', text: r.users ? 'No one has used this role in the last 90 days, but ' + plural(r.users, 'user') + ' still hold it.' : 'No one has used this role in the last 90 days, and no users hold it.' })));
    }
    c.appendChild(h('h3', { 'class': 't-h6', style: 'margin-bottom:8px', text: 'Daily Active Users' }));
    c.appendChild(lineChart(r));
    var rowsT = r.daily.map(function (v, i) { return h('tr', null, h('td', { text: fmtDate(DAYS[i]) }), h('td', { text: String(v) })); });
    c.appendChild(h('details', { 'class': 'data-table', 'data-component': 'none', 'data-gap': 'chart data table (text alternative)', 'data-e2e-ref': 'chart-data-table' },
      h('summary', { text: 'View as Table' }),
      h('div', { 'class': 'scroll' }, h('table', null, h('thead', null, h('tr', null, h('th', { scope: 'col', text: 'Date' }), h('th', { scope: 'col', text: 'Active Users' }))), h('tbody', null, rowsT)))));

    c.appendChild(h('hr', { 'class': 'section-divider', 'data-component': 'FSDivider' }));
    c.appendChild(h('h3', { 'class': 't-h6', text: 'Users With This Role' }));
    if (!users.length) {
      c.appendChild(h('p', { 'class': 't-body2 secondary', style: 'margin-top:8px', 'data-e2e-ref': 'panel-no-users', text: 'No users hold this role. It can be archived without affecting anyone.' }));
    } else {
      var soleN = users.filter(function (u) { return u.solo; }).length;
      c.appendChild(h('p', { 'class': 't-body2 secondary', style: 'margin-top:2px', text: plural(users.length, 'user') + ' hold this role.' + (soleN ? ' ' + soleN + ' of them hold no other role.' : '') }));
      c.appendChild(h('div', { 'class': 'field', 'data-component': 'FSTextField' }, h('label', { 'for': 'panel-q', text: 'Search users' }),
        h('input', { id: 'panel-q', type: 'text', value: S.uq, 'data-fid': 'panel-q',
          oninput: function (e) { S.uq = e.target.value; S.more = 10; withFocus(function () { buildPanel(false); }); } })));
      var list = h('ul', { 'data-component': 'FSList', 'data-e2e-ref': 'role-holders-list' }, shown.slice(0, S.more).map(function (u) {
        return h('li', { 'class': 'list-item', 'data-component': 'FSListItem' },
          h('div', null, h('div', { 'class': 't-subtitle2', text: u.name }), h('div', { 'class': 't-caption secondary', text: u.email }),
            u.solo ? h('div', { 'class': 't-caption warn-text', text: 'No other role. Archiving removes all access.' })
                   : h('div', { 'class': 't-caption secondary', text: 'Also holds: ' + u.held.join(', ') })),
          h('div', { 'class': 'right' }, h('div', { 'class': 't-caption secondary', text: 'Last Sign-In' }), h('div', { 'class': 't-caption', text: fmtDate(u.signIn) })));
      }));
      c.appendChild(list);
      if (!shown.length) c.appendChild(h('p', { 'class': 't-body2 secondary', style: 'margin-top:8px', text: 'No users found matching the search.' }));
      if (shown.length > S.more) c.appendChild(h('button', { 'class': 'btn secondary md', type: 'button', style: 'margin-top:8px', 'data-fid': 'panel-more', 'data-component': 'FSButton',
        onclick: function () { S.more += 10; withFocus(function () { buildPanel(false); }); } }, h('span', { 'class': 'inner', text: 'Show More (' + (shown.length - S.more) + ' left)' })));
      c.appendChild(h('div', { 'class': 't-caption secondary', style: 'margin-top:12px' }, h('a', { 'class': 'link-btn', href: '#', onclick: function (e) { e.preventDefault(); }, text: 'Open in Users' }),
        ' to manage who holds this role.'));
    }
    d.appendChild(c);
    d.appendChild(h('div', { 'class': 'drawer-actions', 'data-component': 'FSDrawerActions' },
      h('div', { 'class': 'grow' }),
      h('button', { 'class': 'btn secondary', type: 'button', 'data-component': 'FSButton', 'data-fid': 'panel-edit' }, h('span', { 'class': 'inner', text: 'Edit Role' })),
      h('button', { 'class': 'btn destructiveSecondary', type: 'button', 'data-component': 'FSButton', 'data-e2e-ref': 'panel-archive-button', 'data-fid': 'panel-archive',
        onclick: function () { openArchive([r.id]); } }, h('span', { 'class': 'inner', text: 'Archive Role' }))));

    var scroll = root.querySelector('.drawer-content'), top = scroll ? scroll.scrollTop : 0;
    wrap.appendChild(back); wrap.appendChild(d);
    root.textContent = ''; root.appendChild(wrap);
    if (first) { requestAnimationFrame(function () { back.classList.add('open'); d.classList.add('open'); }); setInert(true); document.querySelector('[data-fid="panel-close"]').focus(); }
    else { back.classList.add('open'); d.classList.add('open'); d.style.transition = 'none'; d.querySelector('.drawer-content').scrollTop = top; }
  }
  function stat(label, val) { return h('div', null, h('div', { 'class': 'label', text: label }), h('div', { 'class': 'val', text: val })); }

  /* ------------------------------------------------------------------ archive dialog (FSDialog) */
  function openArchive(ids) {
    var opener = document.activeElement; S.dialogReturn = opener && opener.getAttribute ? opener.getAttribute('data-fid') : null;
    S.dialog = { ids: ids, ack: false }; S.busy = false; buildDialog(true); setInert(true);
  }
  function closeDialog() {
    if (S.busy) return;
    S.dialog = null; document.getElementById('dialog-root').textContent = ''; setInert(!!S.panel);
    var n = S.dialogReturn && document.querySelector('[data-fid="' + S.dialogReturn + '"]'); if (n) n.focus();
  }
  function buildDialog(first) {
    var rs = S.dialog.ids.map(function (i) { return byId[i]; }), root = document.getElementById('dialog-root');
    var assigned = rs.filter(function (r) { return r.users > 0; }), heavy = assigned.reduce(function (n, r) { return n + r.users; }, 0);
    var sole = rs.reduce(function (n, r) { return n + r.sole; }, 0);
    var one = rs.length === 1, title = one ? 'Archive Role' : 'Archive Roles';
    var msg;
    if (!assigned.length) msg = one ? rs[0].name + ' has no assigned users.' : 'None of the selected roles has assigned users.';
    else if (one) msg = rs[0].name + ' is still assigned to ' + plural(rs[0].users, 'user') + '. They will lose the access it grants.';
    else msg = plural(assigned.length, 'selected role') + (assigned.length === 1 ? ' is' : ' are') + ' still assigned to ' + plural(heavy, 'user') + '. They will lose the access these roles grant.';
    var needAck = heavy > 0;
    var dlg = h('div', { 'class': 'dialog', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'dlg-title', 'data-component': 'FSDialog', 'data-e2e-ref': 'archive-dialog' },
      h('div', { 'class': 'dialog-title-row' }, h('h2', { id: 'dlg-title', 'data-component': 'FSDialogTitle', text: title }),
        h('button', { 'class': 'icon-btn', type: 'button', 'aria-label': 'Close', disabled: S.busy, 'data-component': 'FSIconButton', onclick: closeDialog }, icon(P.close))),
      h('div', { 'class': 'dialog-content', 'data-component': 'FSDialogContent' },
        h('p', { 'data-component': 'FSDialogContentText', text: 'Archiving removes ' + (one ? 'this role' : 'these roles') + ' from the Roles list and stops ' + (one ? 'it' : 'them') + ' from being assigned. You can restore ' + (one ? 'it' : 'them') + ' later.' }),
        needAck ? h('div', { 'class': 'alert warning', style: 'margin-top:16px', 'data-component': 'FSAlert', 'data-e2e-ref': 'assigned-users-warning' },
          h('span', { 'class': 'alert-icon' }, icon(P.warn, 'icon-20')),
          h('div', { 'class': 'alert-msg' }, h('div', { text: msg }), sole ? h('div', { style: 'margin-top:4px;font-weight:600', text: plural(sole, 'of them holds', 'of them hold').replace(/^(\d+) /, '$1 ') + ' no other role and will have no access to Flock.' }) : null)) : null,
        rs.length > 1 ? h('ul', { 'class': 'role-list' }, rs.slice(0, 5).map(function (r) { return h('li', null, h('span', { text: r.name }), h('span', { 'class': 'secondary', text: plural(r.users, 'User') })); }),
          rs.length > 5 ? h('li', null, h('span', { 'class': 'secondary', text: 'and ' + (rs.length - 5) + ' more' }), h('span')) : null) : null,
        needAck ? h('label', { 'class': 'confirm-check', 'data-component': 'FSCheckbox' },
          h('input', { type: 'checkbox', checked: S.dialog.ack, disabled: S.busy, 'data-fid': 'ack', onchange: function (e) { S.dialog.ack = e.target.checked; withFocus(function () { buildDialog(false); }); } }),
          h('span', { text: 'I understand ' + plural(heavy, 'user') + ' will lose ' + (one ? 'this role' : 'these roles') + '.' })) : null),
      h('div', { 'class': 'dialog-actions', 'data-component': 'FSDialogActions' },
        h('button', { 'class': 'btn ghost', type: 'button', disabled: S.busy, 'data-component': 'FSButton', 'data-fid': 'dlg-cancel', onclick: closeDialog }, h('span', { 'class': 'inner', text: 'Cancel' })),
        h('div', { 'class': 'grow' }),
        h('button', { 'class': 'btn destructivePrimary', type: 'button', 'data-component': 'FSButton', 'data-e2e-ref': 'archive-confirm-button', 'data-fid': 'dlg-confirm',
          disabled: (needAck && !S.dialog.ack) || S.busy, 'aria-busy': S.busy ? 'true' : false, onclick: confirmArchive },
          h('span', { 'class': 'inner' }, S.busy ? h('span', { 'class': 'spinner', 'aria-hidden': 'true' }) : null, S.busy ? 'Archiving' : title))));
    root.textContent = '';
    root.appendChild(h('div', { 'class': 'dialog-wrap' }, h('div', { 'class': 'backdrop open', onclick: closeDialog }), dlg));
    if (first) document.querySelector('[data-fid="dlg-cancel"]').focus();
  }
  function confirmArchive() {
    S.busy = true; withFocus(function () { buildDialog(false); });
    setTimeout(function () {
      var ids = S.dialog.ids; S.busy = false;
      ids.forEach(function (i) { S.archived[i] = true; delete S.selected[i]; });
      S.lastArchived = ids; S.dialog = null; document.getElementById('dialog-root').textContent = '';
      if (S.panel && S.archived[S.panel]) { S.panel = null; document.getElementById('drawer-root').textContent = ''; }
      setInert(!!S.panel); S.page = 0; renderTop(); renderUnused(); renderUsed();
      snack(ids.length === 1 ? byId[ids[0]].name + ' archived' : plural(ids.length, 'role') + ' archived', ids);
      var n = document.querySelector('[data-fid="archive-btn"]'); if (n) n.focus();
    }, 900);
  }

  /* ------------------------------------------------------------------ snackbar */
  var snackTimer;
  function snack(message, ids) {
    var root = document.getElementById('snack-root'); clearTimeout(snackTimer); root.textContent = '';
    root.appendChild(h('div', { 'class': 'snack', 'data-component': 'useSnackbar (FSSnackbar)', 'data-e2e-ref': 'archive-snackbar' },
      icon(P.ok, 'icon-20'), h('div', { 'class': 'msg', text: message }),
      h('button', { 'class': 'btn ghost', type: 'button', 'data-component': 'FSButton', onclick: function () {
        ids.forEach(function (i) { delete S.archived[i]; }); root.textContent = ''; renderTop(); renderUnused(); renderUsed(); } }, h('span', { 'class': 'inner', text: 'Undo' }))));
    snackTimer = setTimeout(function () { root.textContent = ''; }, 10000);
  }

  /* ------------------------------------------------------------------ keyboard */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (S.dialog) closeDialog(); else if (S.panel) closePanel();
  });

  /* ------------------------------------------------------------------ switcher + boot */
  var sw = document.getElementById('switcher');
  sw.appendChild(h('b', { text: 'Prototype state' }));
  VALID.forEach(function (v) {
    sw.appendChild(h('a', { href: '?state=' + v + '&tab=usage', 'aria-current': v === MODE ? 'true' : false, text: LABELS[v] }));
  });

  if (MODE === 'nothing-unused') UNUSED.forEach(function (_, i) { S.archived['x' + i] = true; });
  renderAll();
  if (MODE === 'archive-assigned') { S.selected[LEGACY.id] = true; renderUnused(); openArchive([LEGACY.id]); S.dialogReturn = 'archive-btn'; }
})();
</script>
</body>
